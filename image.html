<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Image Search</title>
        <link rel="stylesheet" href="styles.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search" />
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    </head>
    <body>
        <div class="navigation-links container align-items-center">
            <a class="link-underline link-underline-opacity-0 me-4 link-dark" href="index.html">Back to Search</a>
        </div>
        <div class="container d-flex flex-column" style="height: 75dvh; justify-content: center;">
            <div class=" d-flex flex-column align-items-center justify-content-center">
                <div style="position: relative;">
                    <img class="logo-image" style="max-height: 290px;" src="https://images.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png">
                    <span class="images-span">Images</span>
                </div>
            <form class="basic-search-form" action="https://www.google.com/search">
                <div class="search-bar-container">
                    <div class="search-icon-div">
                        <span class="material-symbols-outlined search-icon" style="font-size: 20px;">search</span>
                    </div>
                    <input class="search-bar" type="text">
                </div>
                <input type="hidden" name="udm" value="2" />
                <div>
                    <input class="submit-button" type="submit" value="Google Search">
                </div>
            </form>
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        </div>
    </body>
</html>
