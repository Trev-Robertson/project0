<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Advanced Search</title>
        <link rel="stylesheet" href="styles.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    </head>
    <body>
        <div class="navigation-links container-fluid align-items-center">
            <a class="me-4 link-underline link-underline-opacity-0 link-underline-opacity-75-hover link-dark" href="index.html">Back to Search</a>
        </div>
          <div class="container">
            <label style="color: #d93025;">Advanced Search</label>
          </div>
          <hr>
          <div class="container-fluid">
            <div class="mb-4">
              Find pages with...
            </div>
            <form action="https://www.google.com/search">
              <div class="find-pages-with-group">
                <div class="row">
                  <label for="all-these-words" class="col-sm-4 col-form-label">all these words:</label>
                  <div class="col-sm-8">
                    <input type="text" class="form-control rounded-0" id="all-these-words" name="as_q">
                  </div>
                </div>
                <div class="row">
                  <label for="this-exact-word" class="col-sm-4 col-form-label">this exact word or phrase:</label>
                  <div class="col-sm-8">
                    <input type="text" class="form-control rounded-0" id="this-exact-word" name="as_epq">
                  </div>
                </div>
                <div class="row">
                  <label for="any-of" class="col-sm-4 col-form-label">any of these words:</label>
                  <div class="col-sm-8">
                    <input type="text" class="form-control rounded-0" id="any-of" name="as_oq">
                  </div>
                </div>
                <div class="row">
                  <label for="none-of" class="col-sm-4 col-form-label">none of these words:</label>
                  <div class="col-sm-8">
                    <input type="text" class="form-control rounded-0" id="none-of" name="as_eq">
                  </div>
                </div>
                <div class="row">
                  <label for="number-ranging" class="col-sm-4 col-form-label">numbers ranging from:</label>
                    <div class="col-sm">
                      <input type="text" class="form-control rounded-0" id="number-ranging" name="as_nlo">
                    </div>
                    <span class="col-sm-1 d-flex align-items-center justify-content-center mb-3">to</span>
                    <div class="col-sm">
                      <input type="text" class="form-control rounded-0" id="number-ranging" name="as_nhi">
                    </div>
                </div>
              </div>
              <hr>
            <div class="mb-4">
              Then narrow your results by...
            </div>
            <form >
              <div class="find-pages-with-group">
                <div class="row">
                  <label for="languages" class="col-sm-4 col-form-label">language:</label>
                  <div class="col-sm-8">
                    <select id="languages" name="lr" class="dropdown-styling">
                      <option value="">any language</option>
                      <option value="lang_af">Afrikaans</option>
                      <option value="lang_ar">Arabic</option>
                      <option value="lang_bg">Bulgarian</option>
                      <option value="lang_ca">Catalan</option>
                      <option value="lang_zh-CN">Chinese</option>
                      <option value="lang_zh-TW">Chinese</option>
                      <option value="lang_en">English</option>
                      <option value="lang_fr">French</option>
                      <option value="lang_de">German</option>
                      <option value="lang_el">Greek</option>
                      <option value="lang_hu">Hungarian</option>
                      <option value="lang_it">Italian</option>
                      <option value="lang_ja">Japanese</option>
                      <option value="lang_ko">Korean</option>
                      <option value="lang_no">Norwegian</option>
                      <option value="lang_pt">Portuguese</option>
                      <option value="lang_es">Spanish</option>
                      <option value="lang_sw">Swahili</option>
                      <option value="lang_th">Thai</option>
                      <option value="lang_tr">Turkish</option>
                      <option value="lang_uk">Ukrainian</option>
                    </select>
                  </div>
                </div>
                <div class="row">
                  <label for="this-exact-word" class="col-sm-4 col-form-label">region:</label>
                  <div class="col-sm-8">
                    <input type="text" class="form-control rounded-0" id="this-exact-word">
                  </div>
                </div>
                <div class="row">
                  <label for="any-of" class="col-sm-4 col-form-label">last update:</label>
                  <div class="col-sm-8">
                    <input type="text" class="form-control rounded-0" id="any-of">
                  </div>
                </div>
                <div class="row">
                  <label for="none-of" class="col-sm-4 col-form-label">site or domain:</label>
                  <div class="col-sm-8">
                    <input type="text" class="form-control rounded-0" id="none-of">
                  </div>
                </div>
                <div class="row">
                  <label for="none-of" class="col-sm-4 col-form-label">terms appearing:</label>
                  <div class="col-sm-8">
                    <input type="text" class="form-control rounded-0" id="none-of">
                  </div>
                </div>
                <div class="row">
                  <label for="none-of" class="col-sm-4 col-form-label">file type:</label>
                  <div class="col-sm-8">
                    <input type="text" class="form-control rounded-0" id="none-of">
                  </div>
                </div>
                <div class="row">
                  <label for="none-of" class="col-sm-4 col-form-label">usage rights:</label>
                  <div class="col-sm-8">
                    <input type="text" class="form-control rounded-0" id="none-of">
                  </div>
                </div>
                <button type="submit" class="btn btn-primary rounded-0">Advanced Search</button>
          </form>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    </body>
</html>
