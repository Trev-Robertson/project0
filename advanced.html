<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Advanced Search</title>
        <link rel="stylesheet" href="styles.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    </head>
    <body>
        <div class="navigation-links container-fluid align-items-center">
            <a class="me-4 link-underline link-underline-opacity-0 link-underline-opacity-75-hover link-dark" href="index.html">Back to Search</a>
        </div>
          <div class="appbar">
            <label style="margin-left: 10px; font-family: Roboto, Arial, sans-serif">Advanced Search</label>
          </div>
          <hr>
          <div class="container-fluid advanced-search-form-container">
            <form action="https://www.google.com/search">
            <div class="mb-4">
              Find pages with...
            </div>
              <div>
                <div class="row">
                  <label for="all-these-words" class="col-sm-4 col-form-label-sm advanced-search-labels">all these words:</label>
                  <div class="col-sm-8">
                    <input type="text" class="form-control rounded-0 advanced-search-inputs" id="all-these-words" name="as_q">
                  </div>
                </div>
                <div class="row">
                  <label for="this-exact-word" class="col-sm-4 col-form-label-sm advanced-search-labels">this exact word or phrase:</label>
                  <div class="col-sm-8">
                    <input type="text" class="form-control rounded-0 advanced-search-inputs" id="this-exact-word" name="as_epq">
                  </div>
                </div>
                <div class="row">
                  <label for="any-of" class="col-sm-4 col-form-label-sm advanced-search-labels">any of these words:</label>
                  <div class="col-sm-8">
                    <input type="text" class="form-control rounded-0 advanced-search-inputs" id="any-of" name="as_oq">
                  </div>
                </div>
                <div class="row">
                  <label for="none-of" class="col-sm-4 col-form-label-sm advanced-search-labels">none of these words:</label>
                  <div class="col-sm-8">
                    <input type="text" class="form-control rounded-0 advanced-search-inputs" id="none-of" name="as_eq">
                  </div>
                </div>
                <div class="row">
                  <label for="number-ranging" class="col-sm-4 col-form-label-sm advanced-search-labels">numbers ranging from:</label>
                    <div class="col-sm">
                      <input type="text" class="form-control rounded-0 advanced-search-inputs" id="number-ranging" name="as_nlo">
                    </div>
                  <label class="col-sm-1 col-form-label-sm">to</label>
                    <div class="col-sm">
                      <input type="text" class="form-control rounded-0 advanced-search-inputs" id="number-ranging" name="as_nhi">
                    </div>
              <div style="border-top: 1px solid #ebebeb; width: 100%; margin: 18px 0; clear: both;"></div>
              <div class="d-flex justify-content-end">
                <button type="submit" class="btn btn-primary rounded-0 advanced-search-button">Advanced Search</button>
              </div>
                </div>
              </div>
          </form>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    </body>
</html>
