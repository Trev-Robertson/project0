<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Search</title>
        <link rel="stylesheet" href="styles.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search" />
    </head>
    <body>
        <div class="navigation-links container-fluid align-items-center">
            <a class="me-2 link-underline link-underline-opacity-0 link-underline-opacity-75-hover link-dark" href="image.html">Image Search</a>
            <a class="me-4 link-underline link-underline-opacity-0 link-underline-opacity-75-hover link-dark" href="advanced.html">Advanced Search</a>
        </div>
        <div class="container-fluid d-flex flex-column logo-search-centering">
            <div class=" d-flex flex-column align-items-center justify-content-center">
                <div>
                    <img class="logo-image" style="max-height: 290px;" src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png">
                </div>
                <form class="basic-search-form" action="https://www.google.com/search">
                    <div class="search-bar-container">
                        <div class="search-icon-div">
                            <span class="material-symbols-outlined search-icon" style="font-size: 20px;">search</span>
                        </div>
                        <input autofocus class="search-bar" type="text" maxlength="2048" name="q">
                    </div>
                    <div class="pt-3">
                        <input class="submit-button" type="submit" value="Google Search">
                        <input class="submit-button" type="submit" value="I'm Feeling Lucky" name="btnI">
                    </div>
                </form>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    </body>
</html>
